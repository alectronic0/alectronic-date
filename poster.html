<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Alec's Dating Application - Poster Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Standalone on purpose: the site stylesheet's hero rules fight a fixed canvas.
       Colours mirror the tokens in css/style.css. */
    :root {
      --bg: #140b12;
      --aubergine: #2a1528;
      --aubergine-2: #3a1f3a;
      --accent: #994ea8;
      --rose: #ff6b8a;
      --rose-light: #ff9bb0;
      --gold: #e6a979;
      --text: #f7eef4;
      --muted: #cbb6c8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(153, 78, 168, 0.45), transparent 55%),
        radial-gradient(ellipse at 90% 95%, rgba(255, 107, 138, 0.28), transparent 50%),
        linear-gradient(160deg, var(--aubergine-2), var(--bg) 70%);
    }
    .emoji { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }

    .poster {
      width: 100%;
      height: 100%;
      padding: 7vmin;
      display: grid;
      gap: 4vmin;
    }

    .copy { display: flex; flex-direction: column; gap: 2vmin; }
    h1, .tagline { text-wrap: balance; }
    .badge { font-size: 7vmin; line-height: 1; }
    h1 {
      font-weight: 800;
      font-size: 11vmin;
      line-height: 1.02;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--rose-light); }
    .tagline { font-weight: 600; font-size: 5.2vmin; line-height: 1.2; color: var(--gold); }

    .photo {
      min-height: 0;
      height: 100%;
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Frame is 4:5 when there's height to spare, widening up to square when there isn't */
    .photo figure {
      width: min(100cqw, 100cqh);
      height: min(100cqh, 125cqw);
      padding: 1.6vmin;
      background: var(--text);
      border-radius: 2.4vmin;
      transform: rotate(-2.5deg);
      box-shadow: 0 3vmin 6vmin rgba(0, 0, 0, 0.55);
    }
    .photo .frame {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 1.4vmin;
    }
    /* Zoom toward the face: at billboard distance the full table outweighs the person */
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      transform: scale(1.35);
      transform-origin: 50% 30%;
      display: block;
    }

    .cta { display: flex; align-items: center; gap: 4vmin; }
    .qr {
      flex: none;
      width: 26vmin;
      height: 26vmin;
      background: #fff;
      border-radius: 2.4vmin;
      padding: 0.8vmin;
      box-shadow: 0 2vmin 4vmin rgba(0, 0, 0, 0.45);
    }
    .qr img { width: 100%; height: 100%; display: block; }
    .cta-text { display: flex; flex-direction: column; gap: 1vmin; }
    .scan { font-weight: 800; font-size: 6vmin; line-height: 1.1; white-space: nowrap; }
    .url { font-weight: 600; font-size: 4.6vmin; color: var(--rose-light); }

    /* Portrait: copy on top, photo fills the middle, scan row at the bottom */
    .poster { grid-template-rows: auto 1fr auto; }

    /* Landscape: photo left, copy + scan row right */
    body.landscape .poster {
      grid-template-columns: 40% 1fr;
      grid-template-rows: 1fr auto;
      column-gap: 6vmin;
      align-items: center;
    }
    body.landscape .photo { grid-row: 1 / span 2; height: 100%; }
    body.landscape .copy { align-self: end; }
    body.landscape .cta { align-self: start; }
    body.landscape h1 { font-size: 10vmin; }

    /* Billboards get a few seconds at distance: scale the scan row up */
    body.billboard .qr { width: 30vmin; height: 30vmin; }
    body.billboard .scan { font-size: 6.4vmin; }
    body.billboard .url { font-size: 5.4vmin; }

    /* A4 is read up close: smaller headline and QR leave room for a bigger photo */
    body[data-format="print"] h1 { font-size: 9.5vmin; }
    body[data-format="print"] .qr { width: 20vmin; height: 20vmin; }
    body[data-format="print"] .poster { gap: 3vmin; }

    /* Social viewers are already on the phone a QR would need */
    body.social .qr { display: none; }

    /* TikTok overlays its UI on the right edge and bottom */
    body[data-format="tiktok"] .poster { padding: 9vmin 16vmin 24vmin 7vmin; }
  </style>
</head>
<body>
  <main class="poster">
    <div class="copy">
      <div class="badge emoji" id="badge"></div>
      <h1 id="headline"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="photo">
      <figure><div class="frame"><img id="lead-photo" alt=""></div></figure>
    </div>
    <div class="cta">
      <div class="qr"><img src="img/qr-code.png" alt="QR code to date.alec.today"></div>
      <div class="cta-text">
        <span class="scan" id="scan">Scan to apply</span>
        <span class="url">date.alec.today</span>
      </div>
    </div>
  </main>

<script src="js/content.js"></script>
<script>
  (function () {
    const LANDSCAPE = ['og', 'billboard-landscape'];
    const BILLBOARD = ['billboard-portrait', 'billboard-landscape'];
    const SOCIAL = ['ig', 'tiktok'];

    const format = new URLSearchParams(location.search).get('format') || 'og';
    const isSocial = SOCIAL.includes(format);
    document.body.dataset.format = format;
    document.body.classList.toggle('landscape', LANDSCAPE.includes(format));
    document.body.classList.toggle('billboard', BILLBOARD.includes(format));
    document.body.classList.toggle('social', isSocial);

    const { hero, meta } = window.CONTENT;
    document.getElementById('badge').textContent = hero.emoji;
    document.getElementById('headline').innerHTML = hero.headline;
    document.getElementById('tagline').textContent = meta.tagline;
    if (isSocial) document.getElementById('scan').textContent = 'Apply at';

    const lead = hero.images[0];
    const photo = document.getElementById('lead-photo');
    photo.src = lead.src;
    photo.alt = lead.alt;
  })();
</script>
</body>
</html>
