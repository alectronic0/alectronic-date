<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alec's Dating Application - Poster Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Poster specific overrides to enforce bounds */
    body {
      background-color: var(--bg-100);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }
    .poster-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      position: relative;
    }
    
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: unset;
      padding: 40px;
    }
    
    .qr-container {
      display: none;
      text-align: center;
      padding: 0 40px 80px;
      margin-top: -20px;
      z-index: 10;
    }
    
    .qr-container img {
      width: 240px;
      height: 240px;
      border-radius: 12px;
      background: white;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .qr-text {
      color: var(--fg-200);
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 16px;
    }

    /* Format Variations */
    body[data-format="og"] .hero-inner {
      flex-direction: row;
      gap: 60px;
    }
    body[data-format="print"] .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body[data-format="print"] .hero-text {
      text-align: center;
    }
    body[data-format="print"] .hero-inner {
      flex-direction: column;
      margin-top: -60px;
    }
    body[data-format="tiktok"] .hero-inner,
    body[data-format="ig"] .hero-inner {
      flex-direction: column;
    }
    body[data-format="tiktok"] .hero {
      padding-bottom: 240px; /* Space for TikTok UI */
    }
    body[data-format="og"] .hero {
      padding: 40px 80px;
    }
    
    .hero-cta, .hero-scroll {
      display: none !important;
    }
  </style>
</head>
<body>

    <div class="hero-inner">
      <div class="hero-text">
        <div class="hero-emoji" id="hero-emoji"></div>

        <p class="hero-sub" id="hero-sub"></p>
        <p class="hero-tagline" id="hero-tagline"></p>
      </div>
      <div class="hero-media" id="hero-media"></div>
    </div>
  </header>

<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const format = params.get('format') || 'og'; // og, tiktok, ig, print
    document.body.setAttribute('data-format', format);

    const hero = window.CONTENT.hero;
    document.getElementById('hero-emoji').textContent = hero.emoji;
    document.getElementById('hero-headline').innerHTML = hero.headline;
    document.getElementById('hero-sub').innerHTML = hero.subheading;
    document.getElementById('hero-tagline').innerHTML = hero.tagline;

    // Build the photo collage
    const mediaDiv = document.getElementById('hero-media');
    const angles = [-6, 4, -4];
    hero.images.forEach((img, i) => {
      const el = document.createElement('img');
      el.src = img.src;
      el.alt = img.alt;
      el.style.transform = `rotate(${angles[i % angles.length]}deg)`;
      el.style.zIndex = hero.images.length - i;
      mediaDiv.appendChild(el);
    });
  })();
</script>
