<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singles & Social Events | Date Alec Today</title>
  <meta name="description" content="Curated singles events, mixers, and social speed dating platforms.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Alec Doran-Twyford">
  <meta name="theme-color" content="#1a1320">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: var(--space-2) var(--space-3);
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent-soft);
      transform: translateX(-2px);
      text-decoration: none;
    }

    .page-main {
      flex: 1;
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-7) var(--space-4);
    }

    .page-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .page-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-light);
      background: var(--surface-2);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-top: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .search-wrapper {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      font-size: 0.95rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
      pointer-events: none;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-2);
    }

    .filter-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .filter-btn:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .results-count {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted-2);
      margin-top: var(--space-2);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-5);
      margin-top: var(--space-4);
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .event-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--rose-light);
      background: rgba(255, 107, 138, 0.12);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 107, 138, 0.3);
    }

    .location-badge {
      font-size: 0.75rem;
      color: var(--muted-2);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-2);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: var(--space-4);
      flex-grow: 1;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-4);
    }

    .tag-pill {
      font-size: 0.75rem;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: var(--space-3) var(--space-4);
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .card-action:hover {
      background: #ab57bd;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-7) var(--space-4);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .footer-note {
      text-align: center;
      padding: var(--space-5);
      color: var(--muted-2);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .footer-note a {
      color: var(--accent-light);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <header class="top-bar">
      <a href="index.html" class="back-link" aria-label="Return to main profile">← Back to Profile</a>
      <a href="ideas.html" class="back-link" style="color: var(--gold);" aria-label="View date ideas">💡 Date Ideas →</a>
    </header>

    <main class="page-main">
      <div class="page-header">
        <span class="page-tag" id="section-tag">🥂 Singles & Events</span>
        <h1 class="page-title" id="section-title">Singles & Social Events</h1>
        <p class="page-subtitle" id="section-subtitle">Curated platforms, events, and venues to meet people and find singles mixers.</p>

        <div class="filter-section">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search singles events, areas, tags..." aria-label="Search events">
          </div>
          <div class="category-pills" id="category-filters">
            <!-- Filter buttons dynamically rendered -->
          </div>
          <div class="results-count" id="results-count"></div>
        </div>
      </div>

      <div class="card-grid" id="events-grid">
        <!-- Injected via JavaScript -->
      </div>
    </main>

    <footer class="footer-note">
      <p>&copy; <span id="year"></span> Alec &middot; <a href="index.html">date.alec.today</a> &middot; All rights reserved.</p>
    </footer>
  </div>

  <script src="js/content.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let activeCategory = 'All';
    let searchQuery = '';

    function renderEvents() {
      const data = window.CONTENT && window.CONTENT.singlesEvents;
      const grid = document.getElementById('events-grid');
      const countEl = document.getElementById('results-count');
      const filterContainer = document.getElementById('category-filters');

      if (!data || !data.items || data.items.length === 0) {
        grid.innerHTML = '<div class="empty-state">No events listed yet. Check back soon!</div>';
        return;
      }

      if (data.tag) document.getElementById('section-tag').textContent = data.tag;
      if (data.title) document.getElementById('section-title').textContent = data.title;
      if (data.subtitle) document.getElementById('section-subtitle').textContent = data.subtitle;

      const categories = ['All', ...new Set(data.items.map(i => i.category).filter(Boolean))];
      
      filterContainer.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">
          ${cat}
        </button>
      `).join('');

      filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        });
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFilters();
      });

      applyFilters();
    }

    function applyFilters() {
      const data = window.CONTENT && window.CONTENT.singlesEvents;
      const grid = document.getElementById('events-grid');
      const countEl = document.getElementById('results-count');
      if (!data || !data.items) return;

      const filtered = data.items.filter(item => {
        const matchesCategory = activeCategory === 'All' || item.category === activeCategory;
        if (!matchesCategory) return false;

        if (!searchQuery) return true;
        const haystack = [
          item.name,
          item.category,
          item.location,
          item.description,
          ...(item.tags || [])
        ].filter(Boolean).join(' ').toLowerCase();

        return haystack.includes(searchQuery);
      });

      countEl.textContent = `Showing ${filtered.length} of ${data.items.length} events`;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No matching events found. Try a different search term or category!</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <article class="event-card">
          <div>
            <div class="card-header">
              <span class="category-badge">${item.category || 'Event'}</span>
              ${item.location ? `<span class="location-badge">📍 ${item.location}</span>` : ''}
            </div>
            <h2 class="card-title">${item.name}</h2>
            <p class="card-desc">${item.description || ''}</p>
          </div>
          <div>
            ${item.tags && item.tags.length ? `
              <div class="tags-row">
                ${item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
              </div>
            ` : ''}
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card-action">
              Visit Website ↗
            </a>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
