<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Consent Mode Defaults -->

  <script src="js/cookie.js" defer></script>

  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerd Gatherings, Cons & Fantasy Balls | Date Alec Today</title>
  <meta name="description" content="Chronological seasonal timeline of UK comic cons, fantasy balls, video game expos, tabletop conventions, ticket prices, and Discord communities.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Alec Doran-Twyford">
  <meta name="theme-color" content="#1a1320">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: var(--space-2) var(--space-3);
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent-soft);
      transform: translateX(-2px);
      text-decoration: none;
    }

    .page-main {
      flex: 1;
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4) var(--space-8);
    }

    .page-header {
      text-align: center;
      margin-bottom: var(--space-7);
    }

    .page-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      background: var(--surface-2);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ─── Seasonal Timeline Sections ──────────────── */
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-7);
      margin-top: var(--space-4);
    }

    .season-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .season-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 2px solid var(--border);
      margin-bottom: var(--space-2);
    }

    .season-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .season-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .season-cards {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* ─── Horizontal Event Card ──────────────── */
    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .event-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: var(--shadow);
    }

    /* Top Row: [LOGO & DATE] + [DETAILS] */
    .card-main-row {
      display: flex;
      gap: var(--space-5);
      align-items: flex-start;
    }

    .card-left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 130px;
      padding: var(--space-3) var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      flex-shrink: 0;
      gap: 6px;
    }

    .card-logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      object-fit: cover;
      padding: 4px;
      display: block;
    }

    .card-date-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .card-date-sub {
      font-size: 0.72rem;
      color: var(--muted-2);
      font-weight: 600;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .card-body-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .card-header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      background: rgba(230, 169, 121, 0.12);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(230, 169, 121, 0.3);
    }

    .month-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .status-active {
      color: var(--mint);
      background: rgba(127, 194, 166, 0.15);
      border: 1px solid rgba(127, 194, 166, 0.35);
    }

    .status-upcoming {
      color: var(--gold);
      background: rgba(230, 169, 121, 0.15);
      border: 1px solid rgba(230, 169, 121, 0.35);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      margin: 2px 0;
    }

    .card-meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      font-size: 0.84rem;
      color: var(--muted);
      margin: 2px 0 6px 0;
    }

    .card-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card-price-pill {
      color: var(--mint);
      font-weight: 700;
      background: rgba(127, 194, 166, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(127, 194, 166, 0.25);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.55;
      margin: 0 0 6px 0;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pill {
      font-size: 0.72rem;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
    }

    /* Bottom Row: [BUY TICKET] | [DISCORD] | [SOCIAL MEDIA] */
    .card-action-bar {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr;
      gap: 10px;
      padding-top: var(--space-3);
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--gold);
      color: #1a1320;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      text-align: center;
    }

    .btn-buy:hover {
      background: #f0be95;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .btn-discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(88, 101, 242, 0.15);
      color: #9aa8fc;
      border: 1px solid rgba(88, 101, 242, 0.35);
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-discord:hover {
      background: #5865F2;
      color: #ffffff;
      border-color: #5865F2;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .btn-discord-disabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface-2);
      color: var(--muted-2);
      border: 1px dashed var(--border);
      font-weight: 500;
      font-size: 0.78rem;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: center;
      user-select: none;
    }

    .btn-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-social:hover {
      background: var(--surface-3);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-7) var(--space-4);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .footer-note {
      text-align: center;
      padding: var(--space-5);
      color: var(--muted-2);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .footer-note a {
      color: var(--gold);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 820px) {
      .card-action-bar {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .card-main-row {
        flex-direction: column;
        align-items: stretch;
      }
      .card-left-col {
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
        padding: 8px 14px;
        min-width: unset;
        gap: 12px;
      }
      .card-logo {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <header class="top-bar">
      <a href="lab.html" class="back-link" aria-label="Return to secret lab">← Secret Lab</a>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <a href="index.html" class="back-link" style="color: var(--text);" aria-label="Main Profile">💘 Profile</a>
        <a href="london-activities.html" class="back-link" style="color: var(--gold);" aria-label="London Activities">🎡 Activities</a>
        <a href="book-workshops.html" class="back-link" style="color: var(--mint);" aria-label="Workshops">🏺 Workshops</a>
        <a href="ideas.html" class="back-link" style="color: var(--rose-light);" aria-label="Date Ideas">💡 Ideas</a>
        <a href="events.html" class="back-link" style="color: var(--accent-light);" aria-label="Events">🥂 Events</a>
      </div>
    </header>

    <main class="page-main">
      <div class="page-header">
        <span class="page-tag" id="section-tag">👾 Event Radar & Timeline</span>
        <h1 class="page-title" id="section-title">Nerd Gatherings, Cons & Fantasy Balls</h1>
        <p class="page-subtitle" id="section-subtitle">Chronological roadmap of major UK comic cons, fantasy balls, video game expos, tabletop conventions, and Discord communities.</p>
      </div>

      <div class="timeline-container" id="timeline-container">
        <!-- Injected via JavaScript by Season -->
      </div>
    </main>

    <footer class="footer-note">
      <p>&copy; <span id="year"></span> Alec &middot; <a href="https://alec.today/" target="_blank" rel="noopener">alec.today</a> &middot; All rights reserved.</p>
    </footer>
  </div>

  <script src="js/content.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function renderGatherings() {
      const data = window.CONTENT && window.CONTENT.nerdGatherings;
      const container = document.getElementById('timeline-container');

      if (!data || !data.items || data.items.length === 0) {
        container.innerHTML = '<div class="empty-state">No gatherings listed yet. Check back soon!</div>';
        return;
      }

      if (data.tag) document.getElementById('section-tag').textContent = data.tag;
      if (data.title) document.getElementById('section-title').textContent = data.title;
      if (data.subtitle) document.getElementById('section-subtitle').textContent = data.subtitle;

      // Group items by Season
      const seasonOrder = [
        "Ongoing & Weekly",
        "Summer '26",
        "Autumn '26",
        "Winter '26 / '27",
        "Spring '27",
        "Summer '27"
      ];

      const seasonIcons = {
        "Ongoing & Weekly": "⚡",
        "Summer '26": "☀️",
        "Autumn '26": "🍂",
        "Winter '26 / '27": "❄️",
        "Spring '27": "🌸",
        "Summer '27": "☀️"
      };

      const grouped = {};
      data.items.forEach(item => {
        const s = item.season || "Upcoming Events";
        if (!grouped[s]) grouped[s] = [];
        grouped[s].push(item);
      });

      // Sort within each season by sortOrder
      Object.keys(grouped).forEach(s => {
        grouped[s].sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));
      });

      // Render sections in order
      const seasonsToRender = seasonOrder.filter(s => grouped[s] && grouped[s].length > 0);
      // Append any unlisted seasons
      Object.keys(grouped).forEach(s => {
        if (!seasonsToRender.includes(s)) seasonsToRender.push(s);
      });

      container.innerHTML = seasonsToRender.map(seasonKey => {
        const items = grouped[seasonKey];
        const icon = seasonIcons[seasonKey] || "🗓️";

        const cardsMarkup = items.map(item => {
          // Status Badge
          const statusBadge = item.status === 'Active'
            ? '<span class="status-badge status-active">🟢 Active / Open</span>'
            : '<span class="status-badge status-upcoming">🎯 Upcoming Date</span>';

          // Favicon / Logo with fallback
          const logoSrc = item.logo || `https://www.google.com/s2/favicons?domain=${new URL(item.url).hostname}&sz=128`;

          // Discord CTA button
          let discordBtnMarkup = '';
          if (item.discordUrl) {
            discordBtnMarkup = `
              <a href="${item.discordUrl}" target="_blank" rel="noopener noreferrer" class="btn-discord">
                💬 Join Discord ↗
              </a>
            `;
          } else if (item.discordNote) {
            discordBtnMarkup = `
              <div class="btn-discord-disabled" title="${item.discordNote}">
                💬 ${item.discordNote}
              </div>
            `;
          } else {
            discordBtnMarkup = `
              <div class="btn-discord-disabled">
                💬 No Public Discord
              </div>
            `;
          }

          // Social / Instagram CTA button
          let socialBtnMarkup = '';
          if (item.instagramUrl) {
            socialBtnMarkup = `
              <a href="${item.instagramUrl}" target="_blank" rel="noopener noreferrer" class="btn-social">
                📸 Instagram ↗
              </a>
            `;
          } else {
            socialBtnMarkup = `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-social">
                🌐 Website ↗
              </a>
            `;
          }

          return `
            <article class="event-card">
              <!-- Top Row: Logo & Date | Details -->
              <div class="card-main-row">
                <!-- Left: Logo & Date Block -->
                <div class="card-left-col">
                  <img src="${logoSrc}" alt="${item.name} logo" class="card-logo" loading="lazy" onerror="this.src='favicon.svg'">
                  <span class="card-date-badge">${item.dateBadge || 'TBD'}</span>
                  <span class="card-date-sub">${item.days || item.approxMonth || ''}</span>
                </div>

                <!-- Right: Details -->
                <div class="card-body-col">
                  <div class="card-header-meta">
                    <span class="category-badge">${item.category || 'Gathering'}</span>
                    ${item.month ? `<span class="month-pill">📅 ${item.month}</span>` : ''}
                    ${statusBadge}
                  </div>

                  <h2 class="card-title">${item.name}</h2>

                  <div class="card-meta-grid">
                    ${item.timing ? `<span class="card-meta-item">🗓️ ${item.timing}</span>` : ''}
                    ${item.location ? `<span class="card-meta-item">📍 ${item.location}</span>` : ''}
                    ${item.price ? `<span class="card-meta-item card-price-pill">🎟️ ${item.price}</span>` : ''}
                  </div>

                  <p class="card-desc">${item.description || ''}</p>

                  ${item.tags && item.tags.length ? `
                    <div class="tags-row">
                      ${item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>

              <!-- Bottom Row: Buy Ticket | Discord | Social Media -->
              <div class="card-action-bar">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-buy">
                  🎟️ Buy Tickets & Official Info ↗
                </a>
                ${discordBtnMarkup}
                ${socialBtnMarkup}
              </div>
            </article>
          `;
        }).join('');

        return `
          <section class="season-section">
            <div class="season-header">
              <h2 class="season-title">${icon} ${seasonKey}</h2>
              <span class="season-badge">${items.length} ${items.length === 1 ? 'Event' : 'Events'}</span>
            </div>
            <div class="season-cards">
              ${cardsMarkup}
            </div>
          </section>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderGatherings);
  </script>
</body>
</html>
