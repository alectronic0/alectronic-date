  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerd Gatherings, Cons & Fantasy Balls | Date Alec Today</title>
  <meta name="description" content="Chronological timeline of UK comic cons, fantasy balls, video game expos, tabletop conventions, ticket prices, and Discord communities.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Alec Doran-Twyford">
  <meta name="theme-color" content="#1a1320">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: var(--space-2) var(--space-3);
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent-soft);
      transform: translateX(-2px);
      text-decoration: none;
    }

    .page-main {
      flex: 1;
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4) var(--space-7);
    }

    .page-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .page-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      background: var(--surface-2);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ─── Horizontal Timeline Cards ──────────────── */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      margin-top: var(--space-4);
    }

    .timeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);
      display: flex;
      gap: var(--space-5);
      align-items: center;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .timeline-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: var(--shadow);
    }

    .timeline-date-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 125px;
      padding: var(--space-3) var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      flex-shrink: 0;
    }

    .timeline-date-badge {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .timeline-date-sub {
      font-size: 0.75rem;
      color: var(--muted-2);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .timeline-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      background: rgba(230, 169, 121, 0.12);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(230, 169, 121, 0.3);
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .status-active {
      color: var(--mint);
      background: rgba(127, 194, 166, 0.15);
      border: 1px solid rgba(127, 194, 166, 0.35);
    }

    .status-upcoming {
      color: var(--gold);
      background: rgba(230, 169, 121, 0.15);
      border: 1px solid rgba(230, 169, 121, 0.35);
    }

    .timeline-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      margin: 2px 0;
    }

    .timeline-meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      font-size: 0.84rem;
      color: var(--muted);
      margin: 3px 0 6px 0;
    }

    .timeline-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .timeline-price {
      color: var(--mint);
      font-weight: 700;
      background: rgba(127, 194, 166, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(127, 194, 166, 0.25);
    }

    .timeline-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 6px 0;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pill {
      font-size: 0.72rem;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .timeline-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      min-width: 175px;
      flex-shrink: 0;
    }

    .timeline-price-tag {
      font-size: 0.8rem;
      color: var(--muted-2);
      text-align: right;
    }

    .timeline-cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--gold);
      color: #1a1320;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .timeline-cta-btn:hover {
      background: #f0be95;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .timeline-discord-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(88, 101, 242, 0.15);
      color: #9aa8fc;
      border: 1px solid rgba(88, 101, 242, 0.35);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .timeline-discord-btn:hover {
      background: #5865F2;
      color: #ffffff;
      border-color: #5865F2;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .timeline-discord-note {
      font-size: 0.75rem;
      color: #9aa8fc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-7) var(--space-4);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .footer-note {
      text-align: center;
      padding: var(--space-5);
      color: var(--muted-2);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .footer-note a {
      color: var(--gold);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .timeline-card {
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-4);
        padding: var(--space-4);
      }
      .timeline-date-block {
        flex-direction: row;
        justify-content: space-between;
        padding: 8px 14px;
        min-width: unset;
      }
      .timeline-actions {
        align-items: stretch;
        min-width: unset;
        margin-top: var(--space-2);
      }
      .timeline-price-tag {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <header class="top-bar">
      <a href="lab.html" class="back-link" aria-label="Return to secret lab">← Secret Lab</a>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <a href="index.html" class="back-link" style="color: var(--text);" aria-label="Main Profile">💘 Profile</a>
        <a href="london-activities.html" class="back-link" style="color: var(--gold);" aria-label="London Activities">🎡 Activities</a>
        <a href="book-workshops.html" class="back-link" style="color: var(--mint);" aria-label="Workshops">🏺 Workshops</a>
        <a href="ideas.html" class="back-link" style="color: var(--rose-light);" aria-label="Date Ideas">💡 Ideas</a>
        <a href="events.html" class="back-link" style="color: var(--accent-light);" aria-label="Events">🥂 Events</a>
      </div>
    </header>

    <main class="page-main">
      <div class="page-header">
        <span class="page-tag" id="section-tag">👾 Event Radar & Timeline</span>
        <h1 class="page-title" id="section-title">Nerd Gatherings, Cons & Fantasy Balls</h1>
        <p class="page-subtitle" id="section-subtitle">Chronological roadmap of major UK comic cons, fantasy balls, video game expos, tabletop conventions, and Discord communities.</p>
      </div>

      <div class="timeline-list" id="gatherings-grid">
        <!-- Injected via JavaScript -->
      </div>
    </main>

    <footer class="footer-note">
      <p>&copy; <span id="year"></span> Alec &middot; <a href="https://alec.today/" target="_blank" rel="noopener">alec.today</a> &middot; All rights reserved.</p>
    </footer>
  </div>

  <script src="js/content.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function renderGatherings() {
      const data = window.CONTENT && window.CONTENT.nerdGatherings;
      const grid = document.getElementById('gatherings-grid');

      if (!data || !data.items || data.items.length === 0) {
        grid.innerHTML = '<div class="empty-state">No gatherings listed yet. Check back soon!</div>';
        return;
      }

      if (data.tag) document.getElementById('section-tag').textContent = data.tag;
      if (data.title) document.getElementById('section-title').textContent = data.title;
      if (data.subtitle) document.getElementById('section-subtitle').textContent = data.subtitle;

      // Maintain chronological order based on sortOrder
      const items = [...data.items].sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));

      grid.innerHTML = items.map(item => {
        let discordMarkup = '';
        if (item.discordUrl) {
          discordMarkup = `
            <a href="${item.discordUrl}" target="_blank" rel="noopener noreferrer" class="timeline-discord-btn">
              💬 Community Discord ↗
            </a>
          `;
        } else if (item.discordNote) {
          discordMarkup = `
            <span class="timeline-discord-note">💬 ${item.discordNote}</span>
          `;
        }

        const statusBadge = item.status === 'Active'
          ? '<span class="status-badge status-active">🟢 Active / Open</span>'
          : '<span class="status-badge status-upcoming">🎯 Upcoming Date</span>';

        return `
          <article class="timeline-card">
            <!-- Left: Date Block -->
            <div class="timeline-date-block">
              <span class="timeline-date-badge">${item.dateBadge || 'TBD'}</span>
              <span class="timeline-date-sub">${item.approxMonth || 'Schedule'}</span>
            </div>

            <!-- Middle: Content & Metadata -->
            <div class="timeline-content">
              <div class="timeline-header">
                <span class="category-badge">${item.category || 'Convention'}</span>
                ${statusBadge}
              </div>
              
              <h2 class="timeline-title">${item.name}</h2>

              <div class="timeline-meta-grid">
                ${item.timing ? `<span class="timeline-meta-item">🗓️ ${item.timing}</span>` : ''}
                ${item.days ? `<span class="timeline-meta-item">⏳ ${item.days}</span>` : ''}
                ${item.location ? `<span class="timeline-meta-item">📍 ${item.location}</span>` : ''}
                ${item.price ? `<span class="timeline-meta-item timeline-price">🎟️ ${item.price}</span>` : ''}
              </div>

              <p class="timeline-desc">${item.description || ''}</p>

              ${item.tags && item.tags.length ? `
                <div class="tags-row">
                  ${item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Right: Actions & CTA -->
            <div class="timeline-actions">
              ${item.price ? `<div class="timeline-price-tag">${item.price.split('·')[0].trim()}</div>` : ''}
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="timeline-cta-btn">
                Get Tickets & Info ↗
              </a>
              ${discordMarkup}
            </div>
          </article>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderGatherings);
  </script>
</body>
</html>
