  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: var(--space-2) var(--space-3);
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent-soft);
      transform: translateX(-2px);
      text-decoration: none;
    }

    .page-main {
      flex: 1;
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4);
    }

    .page-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }

    .page-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      background: var(--surface-2);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto;
    }

    /* ── Controls & Filter Panel ── */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: var(--space-4);
      margin-top: var(--space-5);
      margin-bottom: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      box-shadow: var(--shadow-sm);
    }

    .top-controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
      justify-content: space-between;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      font-size: 0.95rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(230, 169, 121, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
      pointer-events: none;
    }

    .filter-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .region-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .region-select:focus {
      border-color: var(--gold);
    }

    .view-toggle {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .view-btn.active {
      background: var(--gold);
      color: var(--bg);
    }

    #cards-view-container {
      display: block;
    }

    #cards-view-container.hidden {
      display: none;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-5);
      margin-top: var(--space-4);
    }

    .idea-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .idea-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      background: rgba(230, 169, 121, 0.12);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(230, 169, 121, 0.3);
    }

    .location-badge {
      font-size: 0.75rem;
      color: var(--muted-2);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-title {
      font-size: 1.22rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-2);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: var(--space-4);
      flex-grow: 1;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-4);
    }

    .tag-pill {
      font-size: 0.72rem;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card-actions-row {
      display: flex;
      gap: 8px;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      background: var(--surface-3);
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      padding: var(--space-3) var(--space-4);
      border-radius: 10px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      flex: 1;
      text-align: center;
    }

    .card-action:hover {
      background: var(--gold);
      color: var(--bg);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-7) var(--space-4);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .footer-note {
      text-align: center;
      padding: var(--space-5);
      color: var(--muted-2);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .footer-note a {
      color: var(--accent-light);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="js/content.js"></script>
  <script src="js/canals.js"></script>
  <script>

    let activeCategory = 'All';

    let searchQuery = '';
    let map = null;
    let markersLayer = null;
    let primaryTransitLayer = null;
    let coreTransitLayer = null;
    let tertiaryTransitLayer = null;
    let stationMarkersLayer = null;

    const CATEGORY_ICONS = {
      'Pool & Billiards': '🎱',
      'Active & Social Sports': '🏸',
      'Restaurants': '🍽️',
      'Cafes & Bakeries': '🥐',
      'Galleries & Museums': '🏛️',
      'Arts & Crafts': '🎨',
      'Coffee & Cafes': '☕',
      'Bakeries & Pastries': '🥐',
      'Ice Cream & Chocolates': '🍨',
      'Parks & Scenic Walks': '🌳',
      'Zoos & Farms': '🦁',
      'Rock Climbing & Bouldering': '🧗',
      'Social Darts': '🎯',
      'Bowling & Lanes': '🎳',
      'Mini Golf & Topgolf': '⛳',
      'Axe Throwing': '🪓',
      'Archery': '🏹',
      'Go-Karting': '🏎️',
      'Shuffleboard': '🥌',
      'Pottery & Ceramics': '🏺',
      'Art & Workshops': '🎨',
      'Cooking Classes': '🍳',
      'Video Games & Arcades': '👾',
      'Board Games': '🎲',
      'Bars & Speakeasies': '🍸',
      'Live Music & Jazz': '🎷',
      'Comedy Clubs': '🎤',
      'Dinner & Dining': '🍽️',
      'Markets & Food Halls': '🛍️',
      'Farm Shops & Country': '🌾',
      'Museums & Culture': '🏛️',
      'Rooftops & Views': '🌆',
      'Quirky & Shops': '📚'
    };

    function initPage() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data || !data.items) return;

      const tagEl = document.getElementById('section-tag');
      if (data.tag && tagEl) tagEl.textContent = data.tag;
      
      const titleEl = document.getElementById('section-title');
      if (data.title && titleEl) titleEl.textContent = data.title;
      
      const subtitleEl = document.getElementById('section-subtitle');
      if (data.subtitle && subtitleEl) subtitleEl.textContent = data.subtitle;

      // Extract unique categories with item counts
      const categories = ['All', ...new Set(data.items.map(i => i.category).filter(Boolean))];
      const filterContainer = document.getElementById('category-filters');

      filterContainer.innerHTML = categories.map(cat => {
        const icon = CATEGORY_ICONS[cat] ? `${CATEGORY_ICONS[cat]} ` : '';
        const count = cat === 'All'
          ? data.items.length
          : data.items.filter(i => i.category === cat).length;
        return `
          <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}" type="button">
            ${icon}${cat} <span class="filter-count">(${count})</span>
          </button>
        `;
      }).join('');

      filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        });
      });

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim().toLowerCase();
          applyFilters();
        });
      }

      // Always initialize map on load
      initMap();
      applyFilters();
    }

    function initMap() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data) return;

      // Centered between Welwyn Garden City and Central London
      map = L.map('leaflet-map', {
        zoomControl: true,
        scrollWheelZoom: true
      }).setView([51.6500, -0.1500], 10);

      // OpenStreetMap standard key-free tiles
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      primaryTransitLayer = L.layerGroup().addTo(map); // On by default
      coreTransitLayer = L.layerGroup().addTo(map);    // On by default
      tertiaryTransitLayer = L.layerGroup();           // Off by default (optional bonus routes)
      stationMarkersLayer = L.layerGroup().addTo(map); // Dynamically updated

      const overlayMaps = {
        "📍 Date Spots": markersLayer,
        "🚆 Primary Commute (Great Northern)": primaryTransitLayer,
        "🚇 Core Tube & Overground": coreTransitLayer,
        "🟣 Tertiary & Regional Routes (Thameslink, Elizabeth, SWR, London Bridge/Kent, Cambridge)": tertiaryTransitLayer
      };

      // Load Canals Layer (Off by default)
      if (window.CANALS_GEOJSON) {
        const canalLayer = L.geoJSON(window.CANALS_GEOJSON, {
          style: {
            color: '#3498db',
            weight: 2.5,
            opacity: 0.7
          }
        });
        overlayMaps["🌊 Canals & Rivers"] = canalLayer;
      }

      // Add layer control toggle
      L.control.layers(null, overlayMaps, { position: 'topright' }).addTo(map);

      // Re-index stations whenever layers are toggled
      map.on('overlayadd overlayremove', function() {
        updateActiveStations();
      });

      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 150);

      renderTransitLayers();
      updateMapMarkers();
    }

    function renderTransitLayers() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      const t = data && data.transit;
      if (!t || !map) return;

      if (primaryTransitLayer) primaryTransitLayer.clearLayers();
      if (coreTransitLayer) coreTransitLayer.clearLayers();
      if (tertiaryTransitLayer) tertiaryTransitLayer.clearLayers();
      if (stationMarkersLayer) stationMarkersLayer.clearLayers();

      // 1. Home Base Marker (Welwyn Garden City)
      if (t.home && primaryTransitLayer) {
        const homeIcon = L.divIcon({
          className: 'home-marker-icon',
          html: `<div class="custom-map-icon" style="background: #e6a979; color: #160d14; width: 36px; height: 36px; font-size: 19px; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(230,169,121,0.6);">🏡</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        L.marker([t.home.lat, t.home.lng], { icon: homeIcon, zIndexOffset: 1000 })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge" style="background: #e6a979; color: #160d14;">🏡 Home Base</span>
              <h4 class="map-popup-title">${t.home.name}</h4>
              <p class="map-popup-desc">${t.home.description}</p>
            </div>
          `)
          .addTo(primaryTransitLayer);
      }

      // 2. Office Marker (Deliveroo HQ - 1 Cousin Lane)
      if (t.office && primaryTransitLayer) {
        const officeIcon = L.divIcon({
          className: 'office-marker-icon',
          html: `<div class="custom-map-icon" style="background: #00cdbc; color: #fff; width: 36px; height: 36px; font-size: 19px; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(0,205,188,0.6);">💼</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        L.marker([t.office.lat, t.office.lng], { icon: officeIcon, zIndexOffset: 1000 })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge" style="background: #ccfbf1; color: #0f766e; border-color: #99f6e4;">💼 Deliveroo Tech HQ</span>
              <h4 class="map-popup-title">${t.office.name}</h4>
              <p class="map-popup-desc">${t.office.description}</p>
            </div>
          `)
          .addTo(primaryTransitLayer);
      }

      // 3. Draw Polylines into appropriate layer groups
      if (t.lines && t.lines.length > 0) {
        t.lines.forEach(line => {
          let targetLayer = coreTransitLayer;
          if (line.tier === 'primary') targetLayer = primaryTransitLayer;
          else if (line.tier === 'tertiary') targetLayer = tertiaryTransitLayer;

          if (!targetLayer) return;

          const branchLists = line.branches || [line.stations];
          branchLists.forEach(branch => {
            const coords = branch.map(s => [s.lat, s.lng]);
            if (coords.length > 1) {
              L.polyline(coords, {
                color: line.color,
                weight: line.style === 'dashed' ? 4 : 3.5,
                opacity: 0.82,
                dashArray: line.style === 'dashed' ? '8, 5' : null
              }).addTo(targetLayer);
            }
          });
        });
      }

      updateActiveStations();
    }

    function updateActiveStations() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      const t = data && data.transit;
      if (!t || !stationMarkersLayer || !map) return;

      stationMarkersLayer.clearLayers();

      // Collect lines from active visible layers only
      const visibleLines = [];
      if (primaryTransitLayer && map.hasLayer(primaryTransitLayer)) {
        visibleLines.push(...(t.lines || []).filter(l => l.tier === 'primary'));
      }
      if (coreTransitLayer && map.hasLayer(coreTransitLayer)) {
        visibleLines.push(...(t.lines || []).filter(l => l.tier === 'core' || !l.tier));
      }
      if (tertiaryTransitLayer && map.hasLayer(tertiaryTransitLayer)) {
        visibleLines.push(...(t.lines || []).filter(l => l.tier === 'tertiary'));
      }

      if (visibleLines.length === 0) return;

      const stationIndex = {};
      visibleLines.forEach(line => {
        line.stations.forEach(st => {
          const key = `${st.lat.toFixed(4)},${st.lng.toFixed(4)}`;
          if (!stationIndex[key]) {
            stationIndex[key] = { name: st.name, lat: st.lat, lng: st.lng, type: st.type, note: st.note, lines: [] };
          }
          if (!stationIndex[key].lines.some(l => l.shortName === (line.shortName || line.name))) {
            stationIndex[key].lines.push({ shortName: line.shortName || line.name, color: line.color });
          }
          const rank = { origin: 4, terminus: 3, interchange: 2, station: 1 };
          if ((rank[st.type] || 0) > (rank[stationIndex[key].type] || 0)) {
            stationIndex[key].type = st.type;
          }
          if (st.note && !stationIndex[key].note) stationIndex[key].note = st.note;
          if (st.note && st.note.length > (stationIndex[key].note || '').length) stationIndex[key].note = st.note;
        });
      });

      Object.values(stationIndex).forEach(st => {
        const isTerminus = st.type === 'terminus' || st.type === 'origin';
        const isInterchange = st.type === 'interchange';
        const multiLine = st.lines.length > 1;
        const primaryColor = st.lines[0].color;

        const size = isTerminus ? 26 : (isInterchange || multiLine) ? 24 : 18;
        const bg = isTerminus ? primaryColor : '#ffffff';
        const textCol = isTerminus ? '#ffffff' : primaryColor;
        const borderCol = multiLine ? '#333' : primaryColor;
        const borderW = (isInterchange || multiLine) ? 2.5 : 2;

        const stIcon = L.divIcon({
          className: 'train-station-icon',
          html: `<div class="custom-map-icon" style="background: ${bg}; color: ${textCol}; width: ${size}px; height: ${size}px; font-size: ${size * 0.52}px; border: ${borderW}px solid ${borderCol}; box-shadow: 0 2px 5px rgba(0,0,0,0.18);" title="${st.name}">🚆</div>`,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        });

        // Build line badges for popup
        const lineBadges = st.lines.map(l =>
          `<span style="display:inline-flex;align-items:center;gap:3px;background:${l.color}14;color:${l.color};border:1px solid ${l.color}40;border-radius:4px;padding:1px 6px;font-size:0.72rem;font-weight:600;"><span style="width:7px;height:7px;border-radius:50%;background:${l.color};"></span>${l.shortName}</span>`
        ).join(' ');

        L.marker([st.lat, st.lng], { icon: stIcon })
          .bindPopup(`
            <div class="map-popup-card">
              <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">${lineBadges}</div>
              <h4 class="map-popup-title">${st.name}</h4>
              <p class="map-popup-desc">${st.note || st.lines.map(l => l.shortName).join(' · ')}</p>
            </div>
          `)
          .addTo(stationMarkersLayer);
      });
    }

    function getFilteredItems() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data || !data.items) return [];

      return data.items.filter(item => {
        const matchesCategory = activeCategory === 'All' || item.category === activeCategory;
        if (!matchesCategory) return false;



        if (!searchQuery) return true;
        const haystack = [
          item.name,
          item.category,
          item.location,
          item.region,
          item.description,
          ...(item.tags || [])
        ].filter(Boolean).join(' ').toLowerCase();

        return haystack.includes(searchQuery);
      });
    }

    function applyFilters() {
      const filtered = getFilteredItems();
      const countEl = document.getElementById('results-count');
      const grid = document.getElementById('ideas-grid');
      const totalCount = (window.CONTENT && window.CONTENT.dateIdeas && window.CONTENT.dateIdeas.items.length) || 0;

      if (countEl) countEl.textContent = `Showing ${filtered.length} of ${totalCount} date ideas`;

      // Render Cards
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No matching date ideas found. Try adjusting your filters or search keywords!</div>';
      } else {
        grid.innerHTML = filtered.map(item => {
          const catIcon = CATEGORY_ICONS[item.category] || '💡';
          return `
            <article class="idea-card" ${item.lat && item.lng ? `style="cursor: pointer;" onclick="focusOnMap(${item.lat}, ${item.lng}, '${encodeURIComponent(item.name)}')" title="View on Map"` : ''}>
              <div>
                <div class="card-header">
                  <span class="category-badge">${catIcon} ${item.category || 'Idea'}</span>
                  ${item.location ? `<span class="location-badge">📍 ${item.location}</span>` : ''}
                </div>
                <h2 class="card-title">${item.name}</h2>
                <p class="card-desc">${item.description || ''}</p>
              </div>
              <div>
                ${item.tags && item.tags.length ? `
                  <div class="tags-row">
                    ${item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                  </div>
                ` : ''}
                <div class="card-actions-row">
                  ${item.url ? `
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card-action" onclick="event.stopPropagation()">
                    Explore Activity ↗
                  </a>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Render Map Markers
      if (map) {
        updateMapMarkers();
      }
    }

    function updateMapMarkers() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();

      const filtered = getFilteredItems();
      const bounds = [];

      filtered.forEach(item => {
        if (!item.lat || !item.lng) return;
        const iconEmoji = CATEGORY_ICONS[item.category] || '💡';

        const customIcon = L.divIcon({
          className: 'spot-map-marker',
          html: `<div class="custom-map-icon" style="background: #ffffff; border: 2px solid #e6a979; color: #160d14; width: 34px; height: 34px; font-size: 18px; box-shadow: 0 3px 8px rgba(0,0,0,0.22);">${iconEmoji}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge">${iconEmoji} ${item.category || 'Date Idea'}</span>
              <h4 class="map-popup-title">${item.name}</h4>
              <p class="map-popup-desc">${item.description}</p>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="map-popup-btn">Explore Activity ↗</a>
            </div>
          `)
          .addTo(markersLayer);

        bounds.push([item.lat, item.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    // Mobile View Toggle
    const appLayout = document.querySelector('.app-layout');
    const toggleMapBtn = document.getElementById('toggle-map-btn');
    const toggleListBtn = document.getElementById('toggle-list-btn');

    function setMobileView(view) {
      if (view === 'list') {
        if (appLayout) appLayout.classList.add('view-list');
        document.body.classList.add('view-list');
        if (toggleListBtn) {
          toggleListBtn.classList.add('active');
          toggleListBtn.setAttribute('aria-selected', 'true');
        }
        if (toggleMapBtn) {
          toggleMapBtn.classList.remove('active');
          toggleMapBtn.setAttribute('aria-selected', 'false');
        }
      } else {
        if (appLayout) appLayout.classList.remove('view-list');
        document.body.classList.remove('view-list');
        if (toggleMapBtn) {
          toggleMapBtn.classList.add('active');
          toggleMapBtn.setAttribute('aria-selected', 'true');
        }
        if (toggleListBtn) {
          toggleListBtn.classList.remove('active');
          toggleListBtn.setAttribute('aria-selected', 'false');
        }
        if (map) {
          setTimeout(() => map.invalidateSize(), 50);
        }
      }
    }
    window.setMobileView = setMobileView;

    if (toggleMapBtn) toggleMapBtn.addEventListener('click', () => setMobileView('map'));
    if (toggleListBtn) toggleListBtn.addEventListener('click', () => setMobileView('list'));

    window.focusOnMap = function(lat, lng, name) {
      setMobileView('map');
      if (map) {
        setTimeout(() => {
          map.invalidateSize();
          map.setView([lat, lng], 15, { animate: true });
          if (markersLayer) {
            markersLayer.eachLayer(layer => {
              if (layer.getLatLng) {
                const pos = layer.getLatLng();
                if (Math.abs(pos.lat - lat) < 0.0001 && Math.abs(pos.lng - lng) < 0.0001) {
                  layer.openPopup();
                }
              }
            });
          }
        }, 80);
      }
    };

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
