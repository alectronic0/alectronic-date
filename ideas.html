  <link rel="stylesheet" href="css/style.css">

  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: var(--space-2) var(--space-3);
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent-soft);
      transform: translateX(-2px);
      text-decoration: none;
    }

    .page-main {
      flex: 1;
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4);
    }

    .page-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }

    .page-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      background: var(--surface-2);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto;
    }

    /* ── Controls & Filter Panel ── */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: var(--space-4);
      margin-top: var(--space-5);
      margin-bottom: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      box-shadow: var(--shadow-sm);
    }

    .top-controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
      justify-content: space-between;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      font-size: 0.95rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(230, 169, 121, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
      pointer-events: none;
    }

    .filter-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .region-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .region-select:focus {
      border-color: var(--gold);
    }

    .view-toggle {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .view-btn.active {
      background: var(--gold);
      color: var(--bg);
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--gold);
    }

      margin-left: 3px;

    }

    /* ── App Layout ── */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Global fullscreen lock */
      height: 100vh;
      width: 100vw;
    }

    .app-layout {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      background: var(--bg);
    }

    .sidebar-drawer {
      width: 420px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg);

    .drawer-header {

      flex-direction: column;

    #leaflet-map {
      position: absolute;

      left: 0;

    .map-bottom-filters {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);

      .app-layout {
        flex-direction: column-reverse;

      .sidebar-drawer {
        width: 100%;
        height: 50vh;
      }
      .map-area {
        height: 50vh;
      }

    /* ── Leaflet Custom Popups & Markers (Light Theme) ── */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #1a1320 !important;
      border: 1px solid rgba(0, 0, 0, 0.12) !important;

    .map-popup-card {

    .map-popup-badge {

      padding: 2px 8px;

    .map-popup-title {
      font-size: 1rem;

    .map-popup-btn {
      display: block;

    .custom-map-icon {

    }

    .custom-map-icon:hover {
      transform: scale(1.2);
    }

    /* ── Cards Grid ── */
    #cards-view-container {
      display: block;
    }

    #cards-view-container.hidden {
      display: none;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-5);
      margin-top: var(--space-4);
    }

    .idea-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);

    }

    .idea-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);

    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);

    .card-title {
      font-size: 1.22rem;

    }

    .card-desc {

<body>
  <div class="app-layout">
    <!-- ── Left Sidebar Drawer ── -->
    <aside class="sidebar-drawer">
      <header class="drawer-header">
        <div class="top-links" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
          <a href="index.html" class="back-link" aria-label="Return to main profile">← Back to Profile</a>
          <a href="events.html" class="back-link" style="color: var(--rose-light);" aria-label="View singles events">🥂 Singles Events →</a>
        </div>

      </header>

      <!-- ── Cards Grid View ── -->
      <div id="cards-view-container" class="drawer-scroll-area">
        <div class="card-grid sidebar-grid" id="ideas-grid">
          <!-- Injected via JavaScript -->
        </div>
      </div>
    </aside>

    <!-- ── Interactive Map (Right Side) ── -->
    <main id="map-view-container" class="map-area">
      <div id="leaflet-map" role="region" aria-label="Interactive Map of Date Spots"></div>
      
      <!-- ── Map Bottom Filters Panel ── -->
      <div class="map-bottom-filters">
        <div class="category-pills scrollable-pills" id="category-filters">
          <!-- Populated via JavaScript with counts -->
        </div>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="js/content.js"></script>
  <script>

    let activeCategory = 'All';

    let searchQuery = '';
    let map = null;
    let markersLayer = null;
    let transitLayer = null;

    const CATEGORY_ICONS = {
      'Coffee & Cafes': '☕',
      'Bakeries & Pastries': '🥐',
      'Ice Cream & Chocolates': '🍨',
      'Parks & Scenic Walks': '🌳',
      'Zoos & Farms': '🦁',
      'Rock Climbing & Bouldering': '🧗',
      'Social Darts': '🎯',
      'Bowling & Lanes': '🎳',
      'Mini Golf & Topgolf': '⛳',
      'Axe Throwing': '🪓',
      'Archery': '🏹',
      'Go-Karting': '🏎️',
      'Shuffleboard': '🥌',
      'Pottery & Ceramics': '🏺',
      'Art & Workshops': '🎨',
      'Cooking Classes': '🍳',
      'Video Games & Arcades': '👾',
      'Board Games': '🎲',
      'Bars & Speakeasies': '🍸',
      'Live Music & Jazz': '🎷',
      'Comedy Clubs': '🎤',
      'Dinner & Dining': '🍽️',
      'Markets & Food Halls': '🛍️',
      'Farm Shops & Country': '🌾',
      'Museums & Culture': '🏛️',
      'Rooftops & Views': '🌆',
      'Quirky & Shops': '📚'
    };

    function initPage() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data || !data.items) return;

      const tagEl = document.getElementById('section-tag');
      if (data.tag && tagEl) tagEl.textContent = data.tag;
      
      const titleEl = document.getElementById('section-title');
      if (data.title && titleEl) titleEl.textContent = data.title;
      
      const subtitleEl = document.getElementById('section-subtitle');
      if (data.subtitle && subtitleEl) subtitleEl.textContent = data.subtitle;

      // Extract unique categories with item counts
      const categories = ['All', ...new Set(data.items.map(i => i.category).filter(Boolean))];
      const filterContainer = document.getElementById('category-filters');

      filterContainer.innerHTML = categories.map(cat => {
        const icon = CATEGORY_ICONS[cat] ? `${CATEGORY_ICONS[cat]} ` : '';
        const count = cat === 'All'
          ? data.items.length
          : data.items.filter(i => i.category === cat).length;
        return `
          <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}" type="button">
            ${icon}${cat} <span class="filter-count">(${count})</span>
          </button>
        `;
      }).join('');

      filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        });
      });

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim().toLowerCase();
          applyFilters();
        });
      }


      // Always initialize map on load
      initMap();
      applyFilters();
    }

    function initMap() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data) return;

      // Centered between Welwyn Garden City and Central London
      map = L.map('leaflet-map', {
        zoomControl: true,
        scrollWheelZoom: true
      }).setView([51.6500, -0.1500], 10);

      // Light-themed CartoDB Voyager tiles (crisp, beautiful, high-contrast roads, waters, and greenery)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/" target="_blank">CARTO</a> &middot; &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);

      // Load Canals Layer
      fetch('js/canals.geojson')
        .then(res => res.json())
        .then(geojsonData => {
          L.geoJSON(geojsonData, {
            style: {
              color: '#3498db',
              weight: 2.5,
              opacity: 0.7
            }
          }).addTo(map);
        })
        .catch(err => console.warn('Could not load canals:', err));

      markersLayer = L.layerGroup().addTo(map);
      transitLayer = L.layerGroup().addTo(map);

      // The app layout handles full screen implicitly. We force an invalidateSize 
      // just in case DOM paints lag slightly behind leaflet init.
      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 150);

      renderTransitLayer();
      updateMapMarkers();
    }

    function renderTransitLayer() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      const t = data && data.transit;
      if (!t || !transitLayer) return;

      transitLayer.clearLayers();

      // 1. Home Base Marker (Welwyn Garden City)
      if (t.home) {
        const homeIcon = L.divIcon({
          className: 'home-marker-icon',
          html: `<div class="custom-map-icon" style="background: #e6a979; color: #160d14; width: 36px; height: 36px; font-size: 19px; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(230,169,121,0.6);">🏡</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        L.marker([t.home.lat, t.home.lng], { icon: homeIcon, zIndexOffset: 1000 })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge" style="background: #e6a979; color: #160d14;">🏡 Home Base</span>
              <h4 class="map-popup-title">${t.home.name}</h4>
              <p class="map-popup-desc">${t.home.description}</p>
            </div>
          `)
          .addTo(transitLayer);
      }

      // 2. Office Marker (Deliveroo HQ - 1 Cousin Lane)
      if (t.office) {
        const officeIcon = L.divIcon({
          className: 'office-marker-icon',
          html: `<div class="custom-map-icon" style="background: #00cdbc; color: #fff; width: 36px; height: 36px; font-size: 19px; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(0,205,188,0.6);">💼</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        L.marker([t.office.lat, t.office.lng], { icon: officeIcon, zIndexOffset: 1000 })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge" style="background: #ccfbf1; color: #0f766e; border-color: #99f6e4;">💼 Deliveroo Tech HQ</span>
              <h4 class="map-popup-title">${t.office.name}</h4>
              <p class="map-popup-desc">${t.office.description}</p>
            </div>
          `)
          .addTo(transitLayer);
      }

      // 3. Render all transit lines from transit.lines[]
      if (t.lines && t.lines.length > 0) {
        // Pass 1: Draw all polylines (supporting multiple branches per line)
        t.lines.forEach(line => {
          const branchLists = line.branches || [line.stations];
          branchLists.forEach(branch => {
            const coords = branch.map(s => [s.lat, s.lng]);
            if (coords.length > 1) {
              L.polyline(coords, {
                color: line.color,
                weight: line.style === 'dashed' ? 4 : 3.5,
                opacity: 0.82,
                dashArray: line.style === 'dashed' ? '8, 5' : null
              }).addTo(transitLayer);
            }
          });
        });

        // Pass 2: Index every station by coordinate, collecting all lines through it
        const stationIndex = {};
        t.lines.forEach(line => {
          line.stations.forEach(st => {
            const key = `${st.lat},${st.lng}`;
            if (!stationIndex[key]) {
              stationIndex[key] = { name: st.name, lat: st.lat, lng: st.lng, type: st.type, note: st.note, lines: [] };
            }
            stationIndex[key].lines.push({ shortName: line.shortName || line.name, color: line.color });
            // Promote type to most important: origin > terminus > interchange > station
            const rank = { origin: 4, terminus: 3, interchange: 2, station: 1 };
            if ((rank[st.type] || 0) > (rank[stationIndex[key].type] || 0)) {
              stationIndex[key].type = st.type;
            }
            if (st.note && !stationIndex[key].note) stationIndex[key].note = st.note;
            if (st.note && st.note.length > (stationIndex[key].note || '').length) stationIndex[key].note = st.note;
          });
        });

        // Pass 3: Render one marker per unique station
        Object.values(stationIndex).forEach(st => {
          const isTerminus = st.type === 'terminus' || st.type === 'origin';
          const isInterchange = st.type === 'interchange';
          const multiLine = st.lines.length > 1;
          const primaryColor = st.lines[0].color;

          const size = isTerminus ? 26 : (isInterchange || multiLine) ? 24 : 18;
          const bg = isTerminus ? primaryColor : '#ffffff';
          const textCol = isTerminus ? '#ffffff' : primaryColor;
          const borderCol = multiLine ? '#333' : primaryColor;
          const borderW = (isInterchange || multiLine) ? 2.5 : 2;

          const stIcon = L.divIcon({
            className: 'train-station-icon',
            html: `<div class="custom-map-icon" style="background: ${bg}; color: ${textCol}; width: ${size}px; height: ${size}px; font-size: ${size * 0.52}px; border: ${borderW}px solid ${borderCol}; box-shadow: 0 2px 5px rgba(0,0,0,0.18);" title="${st.name}">🚆</div>`,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2]
          });

          // Build line badges for popup
          const lineBadges = st.lines.map(l =>
            `<span style="display:inline-flex;align-items:center;gap:3px;background:${l.color}14;color:${l.color};border:1px solid ${l.color}40;border-radius:4px;padding:1px 6px;font-size:0.72rem;font-weight:600;"><span style="width:7px;height:7px;border-radius:50%;background:${l.color};"></span>${l.shortName}</span>`
          ).join(' ');

          L.marker([st.lat, st.lng], { icon: stIcon })
            .bindPopup(`
              <div class="map-popup-card">
                <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">${lineBadges}</div>
                <h4 class="map-popup-title">${st.name}</h4>
                <p class="map-popup-desc">${st.note || st.lines.map(l => l.shortName).join(' · ')}</p>
              </div>
            `)
            .addTo(transitLayer);
        });
      }
    }

    function getFilteredItems() {
      const data = window.CONTENT && window.CONTENT.dateIdeas;
      if (!data || !data.items) return [];

      return data.items.filter(item => {
        const matchesCategory = activeCategory === 'All' || item.category === activeCategory;
        if (!matchesCategory) return false;



        if (!searchQuery) return true;
        const haystack = [
          item.name,
          item.category,
          item.location,
          item.region,
          item.description,
          ...(item.tags || [])
        ].filter(Boolean).join(' ').toLowerCase();

        return haystack.includes(searchQuery);
      });
    }

    function applyFilters() {
      const filtered = getFilteredItems();
      const countEl = document.getElementById('results-count');
      const grid = document.getElementById('ideas-grid');
      const totalCount = (window.CONTENT && window.CONTENT.dateIdeas && window.CONTENT.dateIdeas.items.length) || 0;

      if (countEl) countEl.textContent = `Showing ${filtered.length} of ${totalCount} date ideas`;

      // Render Cards
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No matching date ideas found. Try adjusting your filters or search keywords!</div>';
      } else {
        grid.innerHTML = filtered.map(item => {
          const catIcon = CATEGORY_ICONS[item.category] || '💡';
          return `
            <article class="idea-card" ${item.lat && item.lng ? `style="cursor: pointer;" onclick="focusOnMap(${item.lat}, ${item.lng}, '${encodeURIComponent(item.name)}')" title="View on Map"` : ''}>
              <div>
                <div class="card-header">
                  <span class="category-badge">${catIcon} ${item.category || 'Idea'}</span>
                  ${item.location ? `<span class="location-badge">📍 ${item.location}</span>` : ''}
                </div>
                <h2 class="card-title">${item.name}</h2>
                <p class="card-desc">${item.description || ''}</p>
              </div>
              <div>
                ${item.tags && item.tags.length ? `
                  <div class="tags-row">
                    ${item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                  </div>
                ` : ''}
                <div class="card-actions-row">
                  ${item.url ? `
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card-action" onclick="event.stopPropagation()">
                    Explore Activity ↗
                  </a>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Render Map Markers
      if (map) {
        updateMapMarkers();
      }
    }

    function updateMapMarkers() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();

      const filtered = getFilteredItems();
      const bounds = [];

      filtered.forEach(item => {
        if (!item.lat || !item.lng) return;
        const iconEmoji = CATEGORY_ICONS[item.category] || '💡';

        const customIcon = L.divIcon({
          className: 'spot-map-marker',
          html: `<div class="custom-map-icon" style="background: #ffffff; border: 2px solid #e6a979; color: #160d14; width: 34px; height: 34px; font-size: 18px; box-shadow: 0 3px 8px rgba(0,0,0,0.22);">${iconEmoji}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon })
          .bindPopup(`
            <div class="map-popup-card">
              <span class="map-popup-badge">${iconEmoji} ${item.category || 'Date Idea'}</span>
              <h4 class="map-popup-title">${item.name}</h4>
              <p class="map-popup-desc">${item.description}</p>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="map-popup-btn">Explore Activity ↗</a>
            </div>
          `)
          .addTo(markersLayer);

        bounds.push([item.lat, item.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    window.focusOnMap = function(lat, lng, name) {
      const mapEl = document.getElementById('map-view-container');
      if (mapEl) {
        mapEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      if (map) {
        map.setView([lat, lng], 15, { animate: true });
        markersLayer.eachLayer(layer => {
          if (layer.getLatLng) {
            const pos = layer.getLatLng();
            if (Math.abs(pos.lat - lat) < 0.0001 && Math.abs(pos.lng - lng) < 0.0001) {
              layer.openPopup();
            }
          }
        });
      }
    };

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
