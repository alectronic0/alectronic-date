  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Bookings & Discovery Map | Date Alec Today</title>
  <meta name="description" content="Discover and book creative workshops, pottery classes, cooking sessions, and unique activities across London & Hertfordshire.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Alec Doran-Twyford">
  <meta name="theme-color" content="#1a1320">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div style="display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden;">
    <div class="warning-banner" style="padding: 8px 16px; border-radius: 0; border-top: none; border-left: none; border-right: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.82rem; z-index: 1000; flex-shrink: 0;">
        <span style="font-size: 1.1rem; line-height: 1;">⚠️</span>
        <span style="color: var(--text);"><strong style="color: var(--gold);">Location Note:</strong> Map pins are rough approximations. Please check the booking website for the actual venue location.</span>
    </div>

    <div class="app-layout" style="height: 100%; flex: 1; min-height: 0;">
        <aside class="sidebar-drawer" id="sidebar">
            <header class="drawer-header">
                <div class="top-links" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <a href="ideas.html" class="back-link" aria-label="Return to ideas map">← Back to Ideas Map</a>
                </div>
                <h1 style="font-size: 2rem; margin-bottom: 10px; color: var(--text);">Discover Workshops</h1>
                <div class="filter-group">
                    <input type="text" id="search" placeholder="Search activities, companies, or locations...">
                </div>
            </header>
            <div id="workshop-list" class="drawer-scroll-area">
                <p style="color: var(--muted); padding: var(--space-4);">Loading workshops...</p>
            </div>
        </aside>
        
        <main id="map-view-container" class="map-area" style="display: flex; flex-direction: column;">
            <div id="map" style="flex: 1; z-index: 1;"></div>
            <div class="map-bottom-filters">
                <div id="category-pills" class="category-pills scrollable-pills">
                    <!-- Pills populated by JS -->
                </div>
                <div id="time-pills" class="category-pills scrollable-pills" style="margin-top: 8px;">
                    <!-- Time pills populated by JS -->
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Data Sources -->
<script src="js/content.js"></script>
<script src="workshops_geo.js"></script>

<!-- Application Logic -->
<script src="js/workshops.js"></script>
</body>
</html>
