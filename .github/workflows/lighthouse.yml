name: Lighthouse CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prerender HTML
        run: |
          npm install puppeteer
          node scripts/prerender.js
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          mkdir -p lhci_dist
          cp index.html lhci_dist/
          cp -r css js img lhci_dist/ || true
          lhci autorun --collect.staticDistDir="./lhci_dist" --upload.target="temporary-public-storage"
